<body draggable="false">
  <pre style="position: absolute; margin: 0; color: lightgray">
click and drag to slingshot a random emoji
hold space while slingshotting to shoot a cone of random emojis
hold shift while dragging to just draw normally (boring)
right click to create a burst of random emojis
  </pre>
</body>
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
/>
<style>
  body {
    margin: 0;
    height: 100dvh;
    width: 100dvw;
    user-select: none;
    overflow: hidden;
  }
</style>
<script>
  /*
   * actions:
   * click and drag to slingshot a random emoji
   * hold space while slingshotting to shoot a cone of random emojis
   * hold shift while dragging to just draw normally (boring)
   * right click to create a burst of random emojis
   */

  // ! constants

  const EMOJIS = Array.from("😀😃😄😁😆😅🤣😂🙂😉😊😇🥰😍🤩😘😗😚😙🥲😏");
  const FRAMERATE = 1000 / 60;
  const DECAY = 0.5;
  const DRAG_FACTOR = 5;
  const MAX_DISTANCE = 12.5;
  const MIN_DISTANCE = 3;
  const BURST_DENSITY = 30;
  const CONE_DENSITY = 50;
  const CONE_SPREAD = 10;

  const b = document.body;

  // ! state

  let dragging = false;
  let dragInitialX = 0;
  let dragInitialY = 0;
  let burst = false;
  let cone = false;
  let draw = false;
  let width = window.innerWidth;
  let height = window.innerHeight;

  // ! utility functions

  // create an object with the
  const CREATEO_E = (e) => {
    let s = document.createElement("span");
    s.textContent = e;
    s.style.pointerEvents = "none";
    s.style.position = "absolute";
    return s;
  };

  // initializing an object with an initial x, y, distance, and angle
  // plus height and width for convenience
  const INITO_OXYDA = (o, x, y, d, a) => {
    o.e_x = x;
    o.e_y = y;
    o.e_d = d;
    o.e_a = a;
    o.e_h = o.clientHeight;
    o.e_w = o.clientWidth;
  };

  const INITLIGHTO_O = (o) => {
    o.e_h = o.clientHeight;
    o.e_w = o.clientWidth;
  };

  const SPAWNO_EXYDA = (e, x, y, d, a) => {
    let o = CREATEO_E(e);
    c.appendChild(o);
    INITO_OXYDA(o, x, y, d, a);
    POSITIONO_OXY(o, x, y);

    let nt = performance.now() + FRAMERATE;
    let f = (step) => {
      requestAnimationFrame(f);
      if (step > nt) {
        nt += FRAMERATE;
        if (o.e_d > 0) {
          MOVEO_O(o);
        }
      }
    };
    requestAnimationFrame(f);
  };

  const POSITIONO_OXY = (o, x, y) => {
    o.style.top = y - o.e_h / 2;
    o.style.left = x - o.e_w / 2;
  };

  // get new x position based on distance and angle
  const MOVEX_XDA = (x, d, a) => {
    let na = Math.cos(nn.degToRad(a));
    let nd = na * d;
    let nx = x + nd;
    return nx;
  };

  // get new y position based on distance and angle
  const MOVEY_YDA = (y, d, a) => {
    let na = Math.sin(nn.degToRad(a));
    let nd = na * d;
    let ny = y + nd;
    return ny;
  };

  // mirroring logic when hitting an x axis
  const MIRRX_A = (a) => {
    return -a % 360;
  };

  // mirroring logic when hitting a y axis
  const MIRRY_A = (a) => {
    return (180 - a) % 360;
  };

  // move an object and decay distance
  const MOVEO_O = (o) => {
    let nx = MOVEX_XDA(o.e_x, o.e_d, o.e_a);
    let ny = MOVEY_YDA(o.e_y, o.e_d, o.e_a);

    // bounds checking
    // x axis (top and bottom)
    if (ny < 0 || ny >= height) {
      o.e_a = MIRRX_A(o.e_a);
      ny = MOVEY_YDA(o.e_y, o.e_d, o.e_a);
    }
    // y axis (left and right)
    if (nx < 0 || nx >= width) {
      o.e_a = MIRRY_A(o.e_a);
      nx = MOVEX_XDA(o.e_x, o.e_d, o.e_a);
    }

    o.e_x = nx;
    o.e_y = ny;
    o.e_d -= DECAY;
    POSITIONO_OXY(o, o.e_x, o.e_y);
  };

  // ! setup

  // main container
  //let c = nn
  //.create("div")
  //.css({ height: "100%", width: "100%", overflow: "hidden" });
  //c.addTo("body");
  let c = document.createElement("div");
  c.style.height = "100%";
  c.style.width = "100%";
  c.style.overflow = "hidden";
  b.appendChild(c);

  let l_s = CREATEO_E("🫥");
  b.appendChild(l_s);
  INITLIGHTO_O(l_s);
  POSITIONO_OXY(l_s, 0, 0);
  let l_e = CREATEO_E("🫥");
  b.appendChild(l_e);
  INITLIGHTO_O(l_e);
  POSITIONO_OXY(l_e, 0, 0);

  let m = CREATEO_E("🥸");
  b.appendChild(m);
  INITLIGHTO_O(m);
  POSITIONO_OXY(m, 0, 0);

  // ! events

  // start dragging
  window.addEventListener("mousedown", (e) => {
    dragging = true;
    dragInitialX = e.clientX;
    dragInitialY = e.clientY;
  });

  // while dragging
  window.addEventListener("mousemove", (e) => {
    if (!draw || !dragging) return;

    let o = CREATEO_E(EMOJIS[Math.floor(Math.random() * EMOJIS.length)]);
    c.appendChild(o);
    INITLIGHTO_O(o);
    POSITIONO_OXY(o, e.clientX, e.clientY);
    // .addTo(c).position(nn.mouseX, nn.mouseY);
  });

  // stop dragging logic
  function onDragStop(e) {
    // need this here for single clicks
    if (dragging && draw) {
      let o = CREATEO_E(EMOJIS[Math.floor(Math.random() * EMOJIS.length)]);
      c.appendChild(o);
      INITLIGHTO_O(o);
      POSITIONO_OXY(o, e.clientX, e.clientY);
    }

    if (!dragging || burst || draw) {
      dragging = false;
      burst = false;
      return;
    }
    dragging = false;

    let d =
      Math.sqrt(
        Math.pow(e.clientX - dragInitialX, 2) +
          Math.pow(e.clientY - dragInitialY, 2),
      ) / DRAG_FACTOR;
    // finding angle from initial to mouse
    let a = nn.radToDeg(
      Math.atan2(dragInitialY - e.clientY, dragInitialX - e.clientX),
    );

    if (cone) {
      for (let i = 0; i < CONE_DENSITY; i++) {
        SPAWNO_EXYDA(
          EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
          dragInitialX,
          dragInitialY,
          nn.random(d / 2, d),
          a + nn.random(-CONE_SPREAD, CONE_SPREAD),
        );
      }
    } else {
      SPAWNO_EXYDA(EMOJIS[Math.floor(Math.random() * EMOJIS.length)], dragInitialX, dragInitialY, d, a);
    }

    //m.position(e.clientX, e.clientY);
    POSITIONO_OXY(m, e.clientX, e.clientY);
    //l_s.position(dragInitialX, dragInitialY);
    POSITIONO_OXY(l_s, dragInitialX, dragInitialY);
    //l_e.position(e.clientX, e.clientY);
    POSITIONO_OXY(l_e, e.clientX, e.clientY);
  }

  // stop dragging event
  window.addEventListener("mouseup", onDragStop);
  // need this for when it goes off screen
  document.body.addEventListener("mouseleave", onDragStop);

  // right click burst
  window.addEventListener("contextmenu", (e) => {
    // don't want the context menu to pop up or the slingshot event to fire
    e.preventDefault();
    burst = true;

    for (let i = 0; i < BURST_DENSITY; i++) {
      let d = nn.random(MIN_DISTANCE, MAX_DISTANCE);
      let a = nn.random(360);

      SPAWNO_EXYDA(EMOJIS[Math.floor(Math.random() * EMOJIS.length)], dragInitialX, dragInitialY, d, a);
    }

    //l_s.position(dragInitialX, dragInitialY);
    POSITIONO_OXY(l_s, dragInitialX, dragInitialY);
    //l_e.position(e.clientX, e.clientY);
    POSITIONO_OXY(l_e, e.clientX, e.clientY);
  });

  // listening for keyboard presses
  window.addEventListener("keydown", (e) => {
    if (e.code == "Space") {
      cone = true;
    } else if (e.code == "ShiftLeft" || e.code == "ShiftRight") {
      draw = true;
    }
  });

  // listening for keyboard releases
  window.addEventListener("keyup", (e) => {
    if (e.code == "Space") {
      cone = false;
    } else if (e.code == "ShiftLeft" || e.code == "ShiftRight") {
      draw = false;
      dragging = false;
    }
  });

  // mouse cursor follows when not dragging
  window.addEventListener("mousemove", (e) => {
    if (!dragging) {
      //m.position(nn.mouseX, nn.mouseY);
      POSITIONO_OXY(m, e.clientX, e.clientY);
    }
  });

  // check for resize events
  window.addEventListener("resize", () => {
    width = window.innerWidth;
    height = window.innerHeight;
  });
</script>
