<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0" />
    <title>noodle</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap");

      /* normalization */
      *,
      *::after,
      *::before {
        box-sizing: border-box;
      }
      html {
        width: 100%;
        min-height: 100%;
      }
      body {
        width: 100%;
      }

      /* common */
      body,
      h1,
      sub,
      p {
        font-family: "Iosevka Charon Mono", "Times New Roman", Times, serif;
        margin: 0;
        text-box: trim-both cap alphabetic;
      }

      /* modifiers */
      .invert {
        color: white;
        mix-blend-mode: difference;
      }
      .no-break {
        text-wrap: nowrap;
      }

      /* main */
      body {
        position: relative;
        padding: 5px;
        background-color: hsl(200 100% 75% / 1);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        width: 100%;
        max-width: 1000px;
      }

      /* definition */
      .def {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .def > :first-child {
        position: relative;
        display: flex;
        align-items: flex-end;
      }
      .def h1 {
        font-size: 5rem;
        font-weight: 600;
        display: inline-block;
      }
      .def sub {
        font-size: 1rem;
        font-weight: 500;
        display: inline-block;
      }
      .def > :not(:first-child) {
        font-size: 1.5rem;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="def">
        <div>
          <h1 class="invert">noodle</h1>
          <sub class="invert"><span class="no-break">ˈnuː.dl̩ //</span> <span class="no-break">nood‧le</span></sub>
        </div>
        <p class="invert"><i>v.</i> To attempt in an informal or uncertain manner; to fiddle.</p>
      </div>
    </div>
    <script>
      let dead = false;
      const INTERVAL = 3000;
      let currInterval = INTERVAL;
      const shift = 0.925;
      const randInterval = () => nn.random(currInterval * 0.7, currInterval * 1.3);
      const width = () => Math.max(body.clientWidth, html.offsetWidth);
      const height = () => Math.max(body.clientHeight, html.offsetHeight);

      let html = document.querySelector("html");
      let body = document.querySelector("body");
      let canvas = nn.create("canvas").position(0, 0).resize(width(), height()).css({ zIndex: -1 }).addTo(body);
      canvas.strokeStyle = "white";
      canvas.fillStyle = "white";
      canvas.lineWidth = 7;
      canvas.font = "3rem serif";

      // algorithms
      async function start10print(x = nn.random(-50, width()), y = nn.random(-50, height()), a = 0, b = Math.floor(nn.random(8, 15)), t = nn.random(10, 30)) {
        let lines = [() => canvas.line(x - 2, y - 2, x + 22, y + 22), () => canvas.line(x + 22, y - 2, x - 2, y + 22)];
        nn.random(lines)();
        if (a == b || x > width()) {
          x -= 20 * (a + 1);
          y += 20;
          a = -1;
        }
        if (y < height()) setTimeout(() => start10print(x + 20, y, a + 1, b, t), (1 / t) * 1000);
      }
      async function startBalls(x = nn.random(0, width()), y = nn.random(0, height()), a = nn.random(0, 360), d = nn.random(20, 50), t = nn.random(30, 60)) {
        let xa = Math.cos(nn.degToRad(a));
        let xd = xa * d;
        let nx = x + xd;

        let ya = Math.sin(nn.degToRad(a));
        let yd = ya * d;
        let ny = y + yd;

        if (nx < 0 || nx > width()) {
          a = (180 - a) % 360;
          nx = nn.clamp(nx, 1, width() - 1);
        }
        if (ny < 0 || ny > height()) {
          a = -a % 360;
          ny = nn.clamp(ny, 1, height() - 1);
        }

        canvas.circle(nx, ny, 10);
        if (d > 0) setTimeout(() => startBalls(nx, ny, a, d - 0.5, t), (1 / t) * 1000);
      }
      const countDefs = async () => {
        let sum = 0;
        for (let w = 0; w < words.length; w++) {
          let res = await fetch(`https://freedictionaryapi.com/api/v1/entries/en/${words[w]}`);
          let json = await res.json();
          for (let i = 0; i < json.entries.length; i++) {
            sum += json.entries[i].senses.length;
          }
        }
        console.log(sum);
      };
      const getDef = async (word) => {
        let res = await fetch(`https://freedictionaryapi.com/api/v1/entries/en/${word}`);
        let json = await res.json();
        if (json.entries.length > 0) {
          let entry = Math.floor(nn.random(json.entries.length));
          let sense = Math.floor(nn.random(json.entries[entry].senses.length));
          return json.entries[entry].senses[sense].definition.split(" ");
        } else return "";
      };
      // 419 definitions btw
      let words = ["net", "web", "development", "word", "noodle", "print", "ball", "waterfall", "sign", "circle", "algorithm", "canvas", "cove", "dictionary", "draw", "top", "operating system", "poster", "presentation", "still", "gem", "rip", "rot", "dream"];
      let lastWaterfall = 0;
      async function startWaterfall(x = nn.random(-50, width()), y = nn.random(-50, height()), d, t = nn.random(5, 10)) {
        if (performance.now() - lastWaterfall < 2000) return; // once every 2 seconds, don't wanna spam their api when things get fast
        if (d == undefined) d = await getDef(nn.random(words));
        let letter = d[0][0];
        let letterWidth = canvas.measureText(letter).width;
        canvas.fillText(letter, x, y);
        d[0] = d[0].slice(1);
        if (d[0] == "") {
          d = d.slice(1);
          y += 10;
        }
        if (d.length > 0 && x < width() && y < height()) setTimeout(() => startWaterfall(x + letterWidth * 0.75, y, d, t), (1 / t) * 1000);
      }
      async function startSigns(x = nn.random(-50, width()), y = nn.random(-50, height()), n = Math.floor(nn.random(1, 120))) {
        let num = n.toString();
        let measurement = canvas.measureText(num);
        let numWidth = measurement.width;
        let numHeight = measurement.actualBoundingBoxAscent - measurement.actualBoundingBoxDescent;
        canvas.fillStyle = "transparent";
        canvas.circle(x, y, Math.max(numWidth * 0.85, numHeight));
        canvas.fillStyle = "white";
        canvas.font = "bold 3rem sans-serif";
        canvas.fillText(num, x - numWidth * 0.55, y + numHeight * 0.5);
        canvas.font = "3rem serif";
      }
      const wavy = (sx, sy, ex, ey) => {
        let a = Math.atan2(ey - sy, ex - sx);
        let d = Math.sqrt(Math.pow(ex - sx, 2) + Math.pow(ey - sy, 2));
        let dx = ex - sx;
        let dy = ey - sy;
        let f = Math.ceil(d / 10);
        let xo = dx / f;
        let yo = dy / f;
        let c = true;
        for (let i = 0; i < f; i++) {
          canvas.beginPath();
          canvas.arc(sx + xo * i + xo / 2, sy + yo * i + yo / 2, d / f / 2, a, a + Math.PI, c);
          canvas.lineWidth = 3;
          canvas.stroke();
          canvas.lineWidth = 7;
          c = !c;
        }
      };
      async function startCircles(x = nn.random(-25, width() - 300), y = nn.random(-25, height() - 300), s = nn.random(250, 400), c = [], a = 0, t = nn.random(4, 8)) {
        let cx = nn.random(x, x + s);
        let cy = nn.random(y, y + s);
        canvas.circle(cx, cy, 10);
        c.push([cx, cy]);

        if (c.length > 1) {
          let o = c.pop();
          let d = c.pop();
          let pxo = d[0] - o[0];
          let pyo = d[1] - d[1];
          let sx = o[0] + pxo * 0.1;
          let sy = o[1] + pyo * 0.1;
          let ex = d[0] - pxo * 0.1;
          let ey = d[1] - pyo * 0.1;
          setTimeout(
            nn.random([
              () => wavy(sx, sy, ex, ey),
              () => {
                canvas.lineWidth = 3;
                canvas.line(sx, sy, ex, ey);
                canvas.lineWidth = 7;
              },
            ]),
            (1 / t) * nn.random(1.2, 2.5) * 1000,
          );
        }
        a++;
        if (a < 24) setTimeout(() => startCircles(x, y, s, c, a, t), (1 / t) * 1000);
      }
      let algorithms = [start10print, startBalls, startWaterfall, startSigns, startCircles];

      function startAlgorithm() {
        let algo = nn.random(algorithms);
        algo();
        algorithms.splice(algorithms.indexOf(algo), 1);
        if (algorithms.length == 0) algorithms = [start10print, startBalls, startWaterfall, startSigns, startCircles];
        if (currInterval > 100) currInterval *= shift;
        if (!dead) setTimeout(startAlgorithm, randInterval());
      }
      setTimeout(startAlgorithm, randInterval());

      async function checkWhitePercetage() {
        let pixels = canvas.getPixels();
        let sum = 0;
        function f(idx) {
          let i = 0;
          for (i = idx; i < idx + 250000 && i < pixels.length; i++) if (pixels[i].a != 0) sum++;
          if (i == pixels.length) {
            if (sum / pixels.length > 0.995) dead = true;
            else setTimeout(checkWhitePercetage, 1000);
          } else setTimeout(() => f(i), 100);
        }
        setTimeout(f(0), 0);
      }
      setTimeout(checkWhitePercetage, 0);

      nn.on("resize", () => canvas.resize(width(), height()));
    </script>
  </body>
</html>
