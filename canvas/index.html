    let desc = nn.create("div").content("first, wait for it to say \"done: 16/16\" on the top. now... what are you looking at? basically, for each pixel, it takes all the colors on the same x axis and all the colors on the same y axis, averages them, and sets that new color as the color of that pixel. it does this for all the pixels in the image. (eg. for pixel (0, 0), it does (0, 0) + (1, 0) + (2, 0) ... (600, 0) + (0, 1), (0, 2) ... (0, 600), then divides by 1220 (it puts a little bit more importance on the color at (0, 0)), and then sets (0, 0) to this new color.) on this website, it also shuffles the \"kernels\" (chunks) of the image. you can play around with that and other settings by clicking on the link above.").addTo(cont);

          let wh = e.data.h;

          if (shuffle) wmod = [];

          for (let y = wt; y < Math.min(wb, wh); y++) {
            for (let x = wl; x < Math.min(wr, ww); x++) {
              let curr = wcoordtoidx(x, y);
              let sumr = 0;
              let sumg = 0;
              let sumb = 0;
              for (let ky = 0; ky < wh; ky++) {
                let kcurr = wcoordtoidx(x, ky);
                let mult = ky == y ? wmult : 1;
                sumr += worig[kcurr].r * mult;
                sumg += worig[kcurr].g * mult;
                sumb += worig[kcurr].b * mult;
              }
              for (let kx = 0; kx < ww; kx++) {

                  sumr += orig[kcurr].r * weights[kernelWidth * ky + kx];

            mod = mods[0].map((_, i) => {
              const valuesAtIndex = mods.map((a) => a[i]);
              return (
                valuesAtIndex.find((val) => val.a != 0) || {
                  r: 0,
                  g: 0,
                  b: 0,
                  a: 0,
                }
              );
            });
          }

          over.setPixels(mod);
          done++;
          dcounter.content(`done: ${done}/${wneeded}`);
          if (done == wneeded) {
            mods = null;
          }
        };
        let msg = {
          l: x,
          t: y,
          r: x + ksize,
          b: y + ksize,
          sumavg: sumavg,
          mult: centerMult,
          w: csize,
          h: csize,
          orig: orig,
          shuffle: shuffle,
        };
        if (!shuffle) {
          msg.mod = mod;
        }
        worker.postMessage(msg);
        workers++;
        wcounter.content(`workers: ${workers}/${wneeded}`);
      }

      for (let y = 0; y <= csize - ksize; y += ksize) {
        for (let x = 0; x <= csize - ksize; x += ksize) {
          setTimeout(() => {
            createWorker(x, y);
          }, 0);
          wneeded++;
          dcounter.content(`done: ${done}/${wneeded}`);
        }
      }

      over.addEventListener("mousemove", (e) => {
        over.setPixels(mod);
        over.clearRect(e.clientX - xray / 2, e.clientY - xray / 2, xray, xray);
      });
      over.addEventListener("mouseleave", () => {
        over.setPixels(mod);
      });
    }, wait);
  }

  setTimeout(setup, 0);
</script>
