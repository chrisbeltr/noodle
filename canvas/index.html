      under.strokeStyle = "blue";
      under.fillStyle = "transparent";
      under.lineWidth = csize / 20;
      under.circle(
        csize / 2,
        csize / 2,
        Math.min((csize - under.lineWidth) / 2, (csize - under.lineWidth) / 2),

      under.strokeStyle = "red";
      under.rect(
        csize / 2 - 50,
        csize / 2 - 50,
        csize / 2 - under.lineWidth / 2 - 50,
        csize / 2 - under.lineWidth / 2 - 50,
      );
      under.strokeStyle = "green";
      under.line(0, 0, csize / 2, csize / 4);
      under.line(csize / 2, csize / 4, csize / 3, (csize * 3) / 4);
      under.line(csize / 3, (csize * 3) / 4, 0, 0);

      console.log("drew under");

      over.addTo("body");
      over.strokeStyle = "transparent";
      over.fillStyle = "transparent";
      //over.rect(0, 0, csize, csize);

      console.log("starting over");

      over.scale(factor, factor);
      let orig = under.getPixels();
      let mod = over.getPixels();
      let centerMult = 30;
      let sumavg = csize + csize + centerMult - 1;
      let ksize = Math.floor(Math.min(csize, csize) / 4);
      //let ksize = 100;
      function m() {
        self.onmessage = function avg(e) {
          let wl = e.data.l;
          let wt = e.data.t;
          let wr = e.data.r;
          let wb = e.data.b;
          let wh = e.data.h;
          let ww = e.data.w;
          let wsumavg = e.data.sumavg;
          let wmult = e.data.mult;
          let wcoordtoidx = (x, y) => y * ww + x;
          let worig = e.data.orig;
          let shuffle = e.data.shuffle;
          let wmod;
          if (shuffle) wmod = [];
          else wmod = e.data.mod;
          //console.log(`${wl}, ${wt}, ${wr}, ${wb}, ${ww}, ${wh}`);
          for (let y = wt; y < Math.min(wb, wh); y++) {
            for (let x = wl; x < Math.min(wr, ww); x++) {
              let curr = wcoordtoidx(x, y);
              let sumr = 0;
              let sumg = 0;
              let sumb = 0;
              for (let ky = 0; ky < wh; ky++) {
                let kcurr = wcoordtoidx(x, ky);
                let mult = ky == y ? wmult : 1;
                sumr += worig[kcurr].r * mult;
                sumg += worig[kcurr].g * mult;
                sumb += worig[kcurr].b * mult;
              }
              for (let kx = 0; kx < ww; kx++) {
                let kcurr = wcoordtoidx(kx, y);
                let mult = kx == y ? wmult : 1;
                sumr += worig[kcurr].r * mult;
                sumg += worig[kcurr].g * mult;
                sumb += worig[kcurr].b * mult;
              }
              /*
              for (let ky = 0; ky < kernelHeight; ky++) {
                for (let kx = 0; kx < kernelWidth; kx++) {
                  let kcurr = coordtoidx(
                    (x + kernelLeft + w) % w,
                    (y + kernelTop + h) % h,
                  );
                  sumr += orig[kcurr].r * weights[kernelWidth * ky + kx];
                  sumg += orig[kcurr].g * weights[kernelWidth * ky + kx];
                  sumb += orig[kcurr].b * weights[kernelWidth * ky + kx];
                  kernelLeft++;
                }
                kernelLeft -= kernelHeight;
                kernelTop++;
              }
              */
              // new pixel
              sumr /= wsumavg;
              sumg /= wsumavg;
              sumb /= wsumavg;

              if (shuffle) {
                let cobj = {};
                cobj.r = sumr;
                cobj.g = sumg;
                cobj.b = sumb;
                cobj.a = 255;
                wmod.push(cobj);
              } else {
                wmod[curr].r = sumr;
                wmod[curr].g = sumg;
                wmod[curr].b = sumb;
                wmod[curr].a = 255;
              }
            }
          }
          self.postMessage(wmod);
          self.close();
        };
      }

      let wneeded = 0;
      let wcounter = nn
        .create("div")
        .addTo("body")
        .css({ position: "relative", zIndex: "1", pointerEvents: "none" })
        .content("workers: 0/0");
      let dcounter = nn
        .create("div")
        .addTo("body")
        .css({ position: "relative", zIndex: "1", pointerEvents: "none" })
        .content("done: 0");
      let workers = 0;
      let done = 0;

      // same script worker stuff found here:
      // https://deebloo.medium.com/make-multithreading-easier-with-inline-web-workers-a58723428a42
      let mods = [mod];
      let currTop = 0;
      let currLeft = 0;
      const blob = new Blob([`(${m.toString()})()`], {
        type: "application/javascript",
      });
      const workerUrl = URL.createObjectURL(blob);
      async function createWorker(x, y) {
        const worker = new Worker(workerUrl);
        worker.onmessage = (e) => {
          if (shuffle) {
            for (let y = 0; y < ksize; y++) {
              if (currTop + y >= csize) break;
              for (let x = 0; x < ksize; x++) {
                if (currLeft + x >= csize) break;
                let data = e.data[y * ksize + x];
                mod[coordtoidx(currLeft + x, currTop + y)] = data
                  ? data
                  : { r: 0, g: 0, b: 0, a: 0 };
              }
            }
            currLeft += ksize;
            if (currLeft >= csize) {
              currLeft = 0;
              currTop += ksize;
            }
          } else {
            mods.push(e.data);
            mod = mods[0].map((_, i) => {
              const valuesAtIndex = mods.map((a) => a[i]);
              return (
                valuesAtIndex.find((val) => val.a != 0) || {
                  r: 0,
                  g: 0,
                  b: 0,
                  a: 0,
                }
              );
            });
          }

          over.setPixels(mod);
          done++;
          dcounter.content(`done: ${done}/${wneeded}`);
          if (done == wneeded) {
            mods = null;
          }
        };
        let msg = {
          l: x,
          t: y,
          r: x + ksize,
          b: y + ksize,
          sumavg: sumavg,
          mult: centerMult,
          w: csize,
          h: csize,
          orig: orig,
          shuffle: shuffle,
        };
        if (!shuffle) {
          msg.mod = mod;
        }
        worker.postMessage(msg);
        workers++;
        wcounter.content(`workers: ${workers}/${wneeded}`);
      }

      for (let y = 0; y <= csize - ksize; y += ksize) {
        for (let x = 0; x <= csize - ksize; x += ksize) {
          setTimeout(() => {
            createWorker(x, y);
          }, 0);
          wneeded++;
          dcounter.content(`done: ${done}/${wneeded}`);
        }
      }

      over.addEventListener("mousemove", (e) => {
        over.setPixels(mod);
        over.clearRect(e.clientX - xray / 2, e.clientY - xray / 2, xray, xray);
      });
      over.addEventListener("mouseleave", () => {
        over.setPixels(mod);
      });
    }, wait);
  }

  setTimeout(setup, 0);
</script>
