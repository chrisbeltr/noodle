<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js"></script>
<script>
  // ! helpers

  // https://stackoverflow.com/questions/6067592/regular-expression-to-match-only-alphabetic-characters
  const isAlphaUnicode = (text) => /^\p{L}+$/u.test(text);
  const strip = (text) => {
    let left = 0;
    for (let l = 0; l < text.length; l++) {
      if (isAlphaUnicode(text[l])) {
        left = l;
        break;
      }
    }
    let right = text.length;
    for (let r = text.length - 1; r >= 0; r--) {
      if (isAlphaUnicode(text[r])) {
        right = r + 1;
        break;
      }
    }
    return text.substring(left, right);
  };
  const toProperNoun = (noun) =>
    noun[0].toUpperCase() + noun.slice(1).toLowerCase();
  // adapted from https://stackoverflow.com/questions/5731863/mapping-a-numeric-range-onto-another
  const mapRange = (v, inMin, inMax, outMin, outMax) =>
    ((v - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
  const sentimentRange = (sent) => {
    let rh = 0;
    let gh = 128;

    let h = 0;
    let s = 100;
    let l = mapRange(Math.abs(sent), 0, 1, 100, 70);

    if (sent < 0) h = rh;
    else h = gh;

    return nn.hsl(h, s, l);
  };

  // ! api constants

  const DICTIONARY_BASE = "https://freedictionaryapi.com/api/v1/entries/en/";
  const SENTIMENT_BASE =
    "https://twinword-sentiment-analysis.p.rapidapi.com/analyze/?text=";
  const SENTIMENT_OPTIONS = {
    method: "GET",
    headers: {
      "x-rapidapi-key": "a27cd1553amsh1001d70238c6521p1f5c60jsn43301de0343f",
      "x-rapidapi-host": "twinword-sentiment-analysis.p.rapidapi.com",
      "Content-Type": "application/json",
    },
  };
  //const WORD_BASE = "https://random-word-api.herokuapp.com/word";
  const WORD_BASE =
    "https://random-words-api.kushcreates.com/api?words=1&language=en";
  const FSH_BASE = "https://api.fsh.plus/";

  // ! api handlers

  async function handleFetch(url, opts) {
    try {
      const response = await fetch(url, opts);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const result = await response.json();
      return result;
    } catch (error) {
      console.error(error);
    }
  }

  async function getSentiment(text) {
    const result = await handleFetch(SENTIMENT_BASE + text, SENTIMENT_OPTIONS);
    if (!result) return;
    return result.score;
  }

  async function getWord() {
    const result = await handleFetch(WORD_BASE);
    if (!result) return;
    return result[0].word;
  }

  async function getDefinition(word) {
    const result = await handleFetch(DICTIONARY_BASE + word);
    if (!result) return;
    if (result.entries.length == 0) return;
    let entry = nn.random(result.entries);
    let sense = nn.random(entry.senses);
    let definition = sense.definition;
    return definition;
  }

  async function transformHex(text) {
    const result = await handleFetch(`${FSH_BASE}hex?type=encode&text=${text}`);
    if (!result) return;
    return result.text;
  }

  async function transformMock(text) {
    const result = await handleFetch(`${FSH_BASE}mock?text=${text}`);
    if (!result) return;
    return result.text;
  }

  async function transformMorse(text) {
    const result = await handleFetch(
      `${FSH_BASE}morse?type=encode&text=${text}`,
    );
    if (!result) return;
    return result.text;
  }

  async function transformReverse(text) {
    const result = await handleFetch(`${FSH_BASE}reverse?text=${text}`);
    if (!result) return;
    return result.text;
  }

  async function transformUwu(text) {
    const result = await handleFetch(`${FSH_BASE}uwuify?text=${text}`);
    if (!result) return;
    return result.text;
  }

  // ! logic

  async function parseDefinition(definition, callback) {
    let words = definition.split(" ");

    let stripped = [];
    words.forEach((w) => {
      stripped.push(strip(w));
    });

    let anchors = [];
    stripped.forEach((w, i) => {
      let anchor = nn.create("a").content(words[i]).set("href", `#${w}`);
      function f() {
        callback(anchor, f);
      }
      anchor.addEventListener("click", f);
      anchor.css({ color: "black", "text-decoration": "none" });
      anchors.push(anchor);
      anchors.push(nn.create("span").content(" "));
    });
    anchors.pop();

    return anchors;
  }

  async function replaceWord(anchor, f) {
    let word = new URL(anchor.href).hash.substring(1);
    location.replace(`#${word.toLowerCase()}`);

    let variants = [getDefinition(word)];
    if (word.toLowerCase() != word)
      variants.push(getDefinition(word.toLowerCase()));
    if (toProperNoun(word) != word)
      variants.push(getDefinition(toProperNoun(word)));
    let definitions = await Promise.all(variants);
    definitions = definitions.filter((item) => item != undefined);
    if (definitions.length == 0) return;
    let definition = nn.random(definitions);

    let anchors = await parseDefinition(definition, replaceWord);
    if (!anchors) return;

    anchor.removeEventListener("click", f);
    anchor.innerHTML = "";
    let sentiment = nn.random(-1, 1);
    let c = sentimentRange(sentiment);
    anchor.css({
      "background-color": c,
      "text-decoration": "none",
      "border-left": "1px dotted black",
      "border-right": "1px dotted black",
      "padding-left": "2px",
      "padding-right": "2px",
    });
    anchors.forEach((a) => {
      anchor.appendChild(a);
    });
  }

  // ! main

  let main = nn.create("div").css({
    display: "flex",
    "flex-direction": "column",
    "justify-content": "space-between",
    "align-items": "flex-end",
    gap: "5px",
    height: "100%",
    "max-height": "100%",
  });
  main.addTo("body");

  let cont = nn.create("div").css({ overflow: "auto", width: "100%" });
  cont.addTo(main);

  let sillyCont = nn.create("div");
  sillyCont.addTo(main);
  let silly = nn.create("input").set({ type: "checkbox", id: "silly" });
  silly.addTo(sillyCont);
  let sillyLabel = nn.create("label").set("for", "silly").content("silly mode");
  sillyLabel.addTo(sillyCont);

  async function initial() {
    let instructions =
      "click on any of the words to replace them with their definition.";
    let instructionWords = await parseDefinition(instructions, replaceWord);
    let instructionsCont = nn.create("div");
    instructionWords.forEach((v) => {
      instructionsCont.appendChild(v);
    });
    instructionsCont.addTo(cont);
    cont.appendChild(nn.create("br"));

    let word = await getWord();
    if (!word) return;
    let definition = await getDefinition(word);
    while (!definition) {
      word = await getWord();
      definition = await getDefinition(word);
    }
    let a = nn.create("a").set("href", `#${word}`);
    location.replace(a.href);
    a.addTo(cont);
    replaceWord(a);
  }

  setTimeout(initial, 0);
</script>
